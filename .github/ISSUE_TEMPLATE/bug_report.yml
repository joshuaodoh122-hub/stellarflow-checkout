name: Bug report
description: Report a bug in StellarFlow Checkout
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill in as much detail as you can so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I call POST /api/checkout with asset='XLM', the response..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the bug.
      placeholder: |
        1. Clone repo
        2. Set up .env with STELLAR_NETWORK=testnet
        3. Run `npm run dev`
        4. POST /api/checkout with body { "fiatAmount": 9.99, "assetCode": "XLM" }
        5. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, npm version, OS, Stellar network (testnet/mainnet).
      placeholder: |
        Node: 20.x
        npm: 9.x
        OS: Ubuntu 22.04
        Stellar network: testnet
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any relevant console output, stack traces, or HTTP responses.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am using testnet (if reporting a payment flow issue).
          required: false
